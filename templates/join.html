{% extends "base.html" %}

{% block title %}Join the queue · LaundryQ{% endblock %}

{% block content %}
  <h2>Join the queue</h2>

  {% if error %}
    <div class="alert alert-danger" role="alert">{{ error }}</div>
  {% endif %}

  {# method="post" sends the form to the same URL as a POST request #}
  <form method="post" class="join-form" style="max-width: 25rem;">
    <div class="mb-3">
      <label class="form-label" for="name">Your name</label>
      <input class="form-control" id="name" name="name" type="text" autofocus>
    </div>
    <button class="btn btn-laundry align-self-start" type="submit">Get a ticket</button>
  </form>

  <p><a href="{{ url_for('index') }}">&larr; Back to the queue</a></p>
{% endblock %}

services:
  db:
    image: postgres:17
    container_name: laundryq-db
    environment:
      POSTGRES_USER: laundryq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: laundryq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laundryq -d laundryq"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: